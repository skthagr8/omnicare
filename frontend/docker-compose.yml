services:

  # ============================================================
  # CAREGIVER APP
  # Next.js
  # ============================================================
  caregiver-app:
    build:
      context: ./caregiver-app
      dockerfile: Dockerfile
      target: development

    container_name: omnicare_caregiver_app

    ports:
      - "3003:3000"

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

    volumes:
      - ./caregiver-app:/app
      - caregiver_node_modules:/app/node_modules
      - caregiver_next:/app/.next

    networks:
      - omnicare_network

    restart: unless-stopped


  # ============================================================
  # ADMIN DASHBOARD
  # Next.js
  # ============================================================
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
      target: development

    container_name: omnicare_admin_dashboard

    ports:
      - "3001:3000"

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000

    volumes:
      - ./admin-dashboard:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next

    networks:
      - omnicare_network

    restart: unless-stopped


  # ============================================================
  # FAMILY PORTAL
  # Vite + React
  # ============================================================
  family-portal:
    build:
      context: ./family-portal
      dockerfile: Dockerfile
      target: development

    container_name: omnicare_family_portal

    ports:
      - "3002:3000"

    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000

    volumes:
      - ./family-portal:/app
      - family_node_modules:/app/node_modules

    networks:
      - omnicare_network

    restart: unless-stopped


# ==============================================================
# PERSISTENT DEVELOPMENT VOLUMES
# ==============================================================

volumes:

  caregiver_node_modules:
  caregiver_next:

  admin_node_modules:
  admin_next:

  family_node_modules:


# ==============================================================
# SHARED OMNICARE NETWORK
# ==============================================================

networks:

  omnicare_network:
    external: true